# This accelerator ships its library as a DATABRICKS NOTEBOOK, not as an installable
# wheel. Load it with:  %run "./XSD to Synthetic - Library"   (see README).
#
# This file therefore exists to (a) declare the third-party packages the notebook
# needs and (b) configure pytest. There is deliberately no [build-system] and no
# packages table: `pip install .` is not a supported entry point. Install the
# dependencies directly:
#     pip install xmlschema pyspark dbldatagen faker rstr
[project]
name = "xsd-to-synthetic"
version = "3.0.0"
description = "Generate synthetic data from XSD schemas using PySpark"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
keywords = ["xsd", "synthetic-data", "pyspark", "databricks", "irs", "xml-schema"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# NOTE: `dependencies` must sit directly under [project]. It previously appeared
# *after* [project.urls], which TOML parses as a key of that table — so these runtime
# requirements were silently invisible to every tool that read this file.
dependencies = [
    "xmlschema>=2.0.0",
    "pyspark>=3.5.0",
    "dbldatagen>=0.3.0",
    "faker>=18.0.0",
    "rstr>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[project.urls]
Homepage = "https://github.com/databricks-industry-solutions/pubsec-best-practices"
Repository = "https://github.com/databricks-industry-solutions/pubsec-best-practices"
Issues = "https://github.com/databricks-industry-solutions/pubsec-best-practices/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
