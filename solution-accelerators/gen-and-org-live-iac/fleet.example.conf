# fleet.example.conf — one export chunk per line. Copy to fleet.conf and edit.
#
#   cp fleet.example.conf fleet.conf
#   ./02_export_fleet.sh --dry-run     # check the plan
#   ./02_export_fleet.sh               # export every chunk
#
# Columns (whitespace-separated; # comments and blank lines ignored):
#   <name>   <profile>   <scope>   [services]
#
#   name      chunk id → captured/<name>/. Keep it descriptive; it is only a
#             directory name, not a Terraform address (the transform classifies
#             resources into planes regardless of which chunk they came from).
#   profile   .databrickscfg profile used for THIS chunk. Account-scope chunks
#             need an account-admin profile; workspace/metastore chunks use a
#             profile whose host is that workspace.
#   scope     account | metastore | workspace  (selects the service preset in
#             01_export.sh — see that file's SCOPE case for exactly what each pulls).
#   services  OPTIONAL. Comma list (NO spaces) overriding the scope preset.
#             Use '-' or omit to take the preset.
#
# Chunking strategy for a large fleet (>20 workspaces, thousands of users/groups):
#   • ONE account chunk — MWS + identity. Users/groups are account-level under
#     identity federation, so they are pulled once here, not once per workspace.
#   • ONE metastore chunk per metastore (usually one per region) — catalogs,
#     schemas, grants. Run it against any workspace attached to that metastore.
#     Deliberately NOT per workspace: UC metadata is metastore-level, not per-ws.
#   • ONE workspace chunk per workspace — compute/SQL/pools/policies only.
#     uc-tables is excluded by the preset (usually far too many to be useful for
#     a governance refactor; add it explicitly only if you truly need it).

# name              profile                scope       services (optional; '-' = preset)
account             my-account-sp    account     -
uc-primary          my-workspace               metastore   -
ws-dev              my-workspace               workspace   -
# ws-staging        my-workspace-staging       workspace   -
# ws-prod           my-workspace-prod          workspace   -

# ── Granular tuning (set as env before the run; see env.example) ─────────────
# Rate-limited on a big account? Turn parallelism down for the whole fleet:
#   EXPORTER_WS_LIST_PARALLELISM=2 ./02_export_fleet.sh
# Slice a huge workspace by name, or exclude noise, per chunk via 01_export.sh:
#   MATCH_REGEX='^team-a-' PROFILE=my-workspace SCOPE=workspace ./01_export.sh captured/ws-team-a
#   EXCLUDE_REGEX='(tmp|scratch|test)_' ...
# Re-sync only what changed since the last pull (incremental):
#   UPDATED_SINCE=2026-09-01T00:00:00Z ./02_export_fleet.sh --force
